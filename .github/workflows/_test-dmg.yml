name: _test-dmg
# Throwaway: verifies installer/build-dmg.sh produces a valid branded DMG on a
# real macOS runner, without touching releases. Delete after verifying.
on:
  workflow_dispatch: {}

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch macOS binaries
        run: bash scripts/fetch-binaries.sh macos
      - name: Mirror device files into Mac bundle
        run: |
          cp kripper/K-Ripper.amxd kripper/kripper.js kripper/kripper.mjs kripper/lib.mjs \
             kripper/package.json kripper/LICENSES.txt kripper-mac/
          rm -rf kripper-mac/assets kripper-mac/vendor
          cp -r kripper/assets kripper/vendor kripper-mac/
      - name: Build branded DMG
        run: bash installer/build-dmg.sh
      - name: Verify the image mounts and is laid out
        run: |
          hdiutil verify dist/K-Ripper-macOS.dmg
          DEV=$(hdiutil attach -nobrowse -readonly dist/K-Ripper-macOS.dmg | egrep '^/dev/' | sed 1q | awk '{print $1}')
          echo "--- visible items in the mounted volume ---"
          ls -la "/Volumes/K-Ripper"
          echo "--- background + volume icon present? ---"
          ls -la "/Volumes/K-Ripper/.background" && test -f "/Volumes/K-Ripper/.VolumeIcon.icns" && echo "volicon OK"
          hdiutil detach "$DEV"
      - uses: actions/upload-artifact@v4
        with:
          name: test-dmg
          path: dist/K-Ripper-macOS.dmg
