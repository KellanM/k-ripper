<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>volicon</title>
<style>
  :root { --signal: #e8341c; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 256px; height: 256px; overflow: hidden; }
  /* Opaque dark fill (no transparent corners -> no white halo in the .icns). */
  body { display: grid; place-items: center; background: radial-gradient(135% 120% at 32% 18%, #1c1b25, #08080c 74%); }
  .tri { border-top: 52px solid transparent; border-bottom: 52px solid transparent;
    border-left: 84px solid var(--signal); margin-left: 16px; filter: drop-shadow(0 0 20px rgba(232,52,28,0.9)); }
</style>
</head>
<body><span class="tri"></span></body>
</html>
